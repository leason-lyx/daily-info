schema_version: 1
sources:
  - id: simon-willison-blog
    title: Simon Willison
    kind: blog
    platform: simonwillison
    homepage: https://simonwillison.net/
    group: Personal Posts
    language: en
    tags: [simon-willison, ai]
    fetch:
      strategy: first_success
      interval_seconds: 3600
      attempts:
        - adapter: feed
          url: https://simonwillison.net/atom/everything/
          timeout_seconds: 30
    fulltext:
      mode: feed_only
    summary:
      auto: true
      window_days: 7
    tagging:
      mode: llm
      max_tags: 5
    auth:
      mode: none
    stability: stable
