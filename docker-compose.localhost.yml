services:
  api:
    ports:
      - "127.0.0.1:8000:8000"

  web:
    command: ["npm", "run", "start", "--", "-H", "0.0.0.0", "-p", "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}

  rsshub:
    ports:
      - "127.0.0.1:1200:1200"
